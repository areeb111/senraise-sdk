name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Library
        run: ./gradlew :senraise:assembleRelease :senraise:testDebugUnitTest

      # Compiles everything in /examples too, and exercises the R8 consumer
      # rules that keep the AIDL stub unrenamed.
      - name: Sample and examples
        run: ./gradlew :samples:app:assembleRelease

      - name: Lint
        run: ./gradlew lint

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            senraise/build/reports/
            samples/app/build/reports/
          if-no-files-found: ignore
